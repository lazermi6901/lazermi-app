<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020504"><title>LAZERMI</title><link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -10%,#063428,#020504 35%,#000 75%)}header{height:78px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:30px;font-weight:950;font-style:italic}.ib{border:0;background:none;color:#fff;font-size:26px;padding:10px}.view{display:none}.view.on{display:block}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:13px}.tab{border:1px solid #294139;background:#06100d;color:#aaa;border-radius:22px;padding:9px 15px}.tab.on{background:#00e88f;color:#001b11;font-weight:800}.search{width:100%;padding:12px;background:#07100d;border:1px solid #294139;color:#fff;border-radius:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{border:1px solid #24362f;background:#040806;border-radius:15px;overflow:hidden}.card{position:relative}.card img{width:100%;height:150px;object-fit:cover;background:#0b1713}.card h3{font-size:15px;margin:9px 10px 4px}.fav{position:absolute;right:7px;top:7px;width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:21px}.stats{padding:5px 10px;font-size:14px;line-height:1.55}.sold{color:#ff453a;font-weight:900;margin:5px 10px}.btn,.primary{width:calc(100% - 20px);margin:7px 10px 10px;padding:11px;border-radius:12px;border:1px solid #315044;background:#09110e;color:#fff;font-weight:700}.primary{width:100%;margin:8px 0;background:#00e88f;color:#001b11;border:0}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:76px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:#030605f5;border-top:1px solid #26352f}.bottom button{border:0;background:none;color:#8c9691;font-size:11px}.bottom button.on{color:#00e88f}.ni{display:block;font-size:21px;margin-bottom:3px}.panel{padding:14px;margin:10px 0}.hero{width:100%;height:280px;object-fit:cover;border-radius:18px}.field{width:100%;padding:12px;margin:6px 0 10px;border-radius:10px;border:1px solid #31453e;background:#07100d;color:#fff}.row{display:flex;justify-content:space-between;align-items:center}.music{padding:13px 0;border-bottom:1px solid #1d2925}.adminline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1d2925}.adminline .grow{flex:1}.empty{text-align:center;color:#8c9691;padding:60px 10px}
</style></head><body><main class="app">
<section id="home" class="view on"><header><button class="ib" onclick="go('admin')">♛</button><div class="logo">LAZERMI</div><button class="ib" onclick="go('catalog')">⌕</button></header><div class="panel" style="text-align:center;padding:36px 15px"><div style="font-size:58px">♛</div><div class="logo" style="font-size:42px">LAZERMI</div><p style="color:#99a49f">Catalogue fictif du jeu</p></div><div class="grid"><button class="panel" onclick="go('catalog')">◫<br><b>CATALOGUE</b></button><button class="panel" onclick="go('favorites')">♡<br><b>FAVORIS</b></button><button class="panel" onclick="go('collection')">▣<br><b>COLLECTION</b></button><button class="panel" onclick="go('music')">♫<br><b>MUSIQUE</b></button></div></section>
<section id="catalog" class="view"><header><b style="font-size:27px">Catalogue</b><button class="ib" onclick="q.focus()">⌕</button></header><input id="q" class="search" placeholder="Rechercher un objet..." oninput="renderCatalog()"><div class="tabs" id="tabs"></div><div class="grid" id="catalogGrid"></div></section>
<section id="details" class="view"><header><button class="ib" onclick="go('catalog')">‹</button><b>Détails</b><button class="ib" id="dfav">♡</button></header><img id="dimg" class="hero"><h1 id="dname"></h1><span id="dcat" class="tab on"></span><p id="ddesc" style="color:#aab2ae;line-height:1.5"></p><div class="panel" id="dstats"></div><button class="primary" onclick="addCollection()">Ajouter à ma collection</button></section>
<section id="collection" class="view"><header><b style="font-size:25px">📦 Collection</b></header><div class="grid" id="collectionGrid"></div></section>
<section id="favorites" class="view"><header><b style="font-size:25px">♡ Favoris</b></header><div class="grid" id="favGrid"></div></section>
<section id="music" class="view"><header><b style="font-size:25px">Musique</b><span>⌕</span></header><div class="panel row"><div><b id="nowTrack">Chill Vibes</b><br><small>LAZERMI</small></div><button class="ib" id="play" onclick="togglePlay()">▶</button></div><div id="trackList"></div></section>
<section id="profile" class="view"><header><b style="font-size:25px">Profil</b></header><div class="panel"><h2>Joueur</h2><p style="color:#999">Favoris et collection sauvegardés sur cet iPhone.</p><button class="primary" onclick="go('admin')">Mode créateur</button></div></section>
<section id="admin" class="view"><header><button class="ib" onclick="go('profile')">‹</button><b style="font-size:25px">Admin</b><span>⚙</span></header><div id="login" class="panel"><h2>Connexion Admin</h2><input id="code" class="field" type="password" placeholder="Code créateur"><button class="primary" onclick="loginAdmin()">Se connecter</button></div><div id="adminPanel" style="display:none"><button class="primary" onclick="newItem()">+ Ajouter un item</button><div id="adminList"></div></div></section>
<section id="edit" class="view"><header><button class="ib" onclick="go('admin')">‹</button><b>Modifier l'item</b><span></span></header><input id="eName" class="field" placeholder="Nom"><input id="eImg" class="field" placeholder="URL image"><select id="eCat" class="field"><option>Objets</option><option>Rares</option><option>Filtres</option><option>Autres</option></select><textarea id="eDesc" class="field" placeholder="Description"></textarea><input id="eG" class="field" type="number" step=".1" placeholder="Valeur G"><input id="eBalls" class="field" type="number" placeholder="Points 🎾"><label class="panel" style="display:block"><input id="eSold" type="checkbox"> Marquer <b style="color:#ff453a">ÉPUISÉ</b></label><button class="primary" onclick="saveEdit()">Enregistrer</button><button class="btn" onclick="deleteItem()" style="color:#ff453a">Supprimer</button></section>
</main>
<nav class="bottom"><button data-v="home" class="on" onclick="go('home')"><span class="ni">⌂</span>Accueil</button><button data-v="catalog" onclick="go('catalog')"><span class="ni">◫</span>Catalogue</button><button data-v="collection" onclick="go('collection')"><span class="ni">▣</span>Collection</button><button data-v="favorites" onclick="go('favorites')"><span class="ni">♡</span>Favoris</button><button data-v="music" onclick="go('music')"><span class="ni">♫</span>Musique</button></nav>
<script>
const svg='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500"><rect width="100%" height="100%" fill="#07100d"/><circle cx="300" cy="230" r="120" fill="#0b5039"/><text x="300" y="260" text-anchor="middle" fill="white" font-size="90">✦</text></svg>');
let items=JSON.parse(localStorage.getItem('lz2items')||'null')||[{id:1,name:'CRYSTAL LEMON',cat:'Rares',img:svg,desc:'Cristal rare provenant des zones avancées du jeu.',g:1.4,balls:10,sold:false},{id:2,name:'VIOLET CORE',cat:'Objets',img:svg,desc:'Noyau violet utilisé dans les améliorations.',g:1.7,balls:10,sold:true},{id:3,name:'FILTRE X3 90U',cat:'Filtres',img:svg,desc:'Module fictif de niveau X3.',g:1.4,balls:10,sold:false},{id:4,name:'PURPLE RELIC',cat:'Rares',img:svg,desc:'Relique violette de collection.',g:1,balls:10,sold:false}];
let fav=JSON.parse(localStorage.getItem('lz2fav')||'[]'),coll=JSON.parse(localStorage.getItem('lz2coll')||'[]'),category='Tous',selected=1,editId=null;
function save(){localStorage.setItem('lz2items',JSON.stringify(items));localStorage.setItem('lz2fav',JSON.stringify(fav));localStorage.setItem('lz2coll',JSON.stringify(coll))}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='catalog')renderCatalog();if(v==='favorites')renderFav();if(v==='collection')renderCollection();if(v==='admin')renderAdmin();scrollTo(0,0)}
function card(x){return `<article class="card"><button class="fav" onclick="toggleFav(${x.id},event)">${fav.includes(x.id)?'♥':'♡'}</button><img src="${x.img||svg}" onerror="this.src=svg"><h3>${x.name}</h3>${x.sold?'<div class="sold">ÉPUISÉ</div>':''}<div class="stats">G ${x.g} → 🎾 ${x.balls}<br>G ${(x.g*2).toFixed(1)} → 🎾 ${x.balls*2}</div><button class="btn" onclick="details(${x.id})">Voir détails ›</button></article>`}
function renderCatalog(){let cats=['Tous','Objets','Rares','Filtres','Autres'];tabs.innerHTML=cats.map(c=>`<button class="tab ${category===c?'on':''}" onclick="category='${c}';renderCatalog()">${c}</button>`).join('');let s=(q.value||'').toLowerCase();catalogGrid.innerHTML=items.filter(x=>(category==='Tous'||x.cat===category)&&x.name.toLowerCase().includes(s)).map(card).join('')}
function toggleFav(id,e){e&&e.stopPropagation();fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];save();renderCatalog();renderFav()}
function details(id){selected=id;let x=items.find(i=>i.id===id);dimg.src=x.img||svg;dname.textContent=x.name;dcat.textContent=x.cat;ddesc.textContent=x.desc;dstats.innerHTML=`${x.sold?'<div class="sold">ÉPUISÉ</div>':''}<b>Statistiques</b><p>G ${x.g} → 🎾 ${x.balls}</p><p>G ${(x.g*2).toFixed(1)} → 🎾 ${x.balls*2}</p>`;dfav.textContent=fav.includes(id)?'♥':'♡';dfav.onclick=()=>{toggleFav(id);details(id)};go('details')}
function addCollection(){if(!coll.includes(selected))coll.push(selected);save();go('collection')}
function renderFav(){favGrid.innerHTML=items.filter(x=>fav.includes(x.id)).map(card).join('')||'<div class="empty">Aucun favori.</div>'}
function renderCollection(){collectionGrid.innerHTML=items.filter(x=>coll.includes(x.id)).map(card).join('')||'<div class="empty">Collection vide.</div>'}
let playing=false;function togglePlay(){playing=!playing;play.textContent=playing?'Ⅱ':'▶'}trackList.innerHTML=['Chill Vibes','Night Drive','Deep Focus','Sunset','Good Mood'].map(t=>`<div class="music" onclick="nowTrack.textContent='${t}';playing=true;play.textContent='Ⅱ'"><b>${t}</b><br><small>LAZERMI</small></div>`).join('');
function loginAdmin(){if(!code.value)return alert('Entre ton code créateur.');sessionStorage.setItem('lz2admin','1');renderAdmin()}
function renderAdmin(){let ok=sessionStorage.getItem('lz2admin')==='1';login.style.display=ok?'none':'block';adminPanel.style.display=ok?'block':'none';if(ok)adminList.innerHTML=items.map(x=>`<div class="adminline"><div class="grow"><b>${x.name}</b><br><small>${x.sold?'ÉPUISÉ • ':''}G ${x.g} / 🎾 ${x.balls}</small></div><button onclick="editItem(${x.id})">✎</button></div>`).join('')}
function editItem(id){editId=id;let x=items.find(i=>i.id===id);eName.value=x.name;eImg.value=x.img===svg?'':x.img;eCat.value=x.cat;eDesc.value=x.desc;eG.value=x.g;eBalls.value=x.balls;eSold.checked=x.sold;go('edit')}
function newItem(){let id=Date.now();items.push({id,name:'NOUVEL ITEM',cat:'Objets',img:svg,desc:'Nouvel objet fictif.',g:1,balls:10,sold:false});save();editItem(id)}
function saveEdit(){let x=items.find(i=>i.id===editId);x.name=eName.value||'ITEM';x.img=eImg.value||svg;x.cat=eCat.value;x.desc=eDesc.value;x.g=+eG.value||0;x.balls=+eBalls.value||0;x.sold=eSold.checked;save();go('admin')}
function deleteItem(){items=items.filter(i=>i.id!==editId);fav=fav.filter(i=>i!==editId);coll=coll.filter(i=>i!==editId);save();go('admin')}
renderCatalog();
</script></body></html>
